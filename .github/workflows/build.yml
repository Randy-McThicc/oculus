name: Build and publish AI Radar

on:
  schedule:
    - cron: "0 * * * *"   # every hour, at minute 0
  workflow_dispatch:        # also lets you run it by hand from the GitHub UI

permissions:
  contents: write           # allow the robot to commit + push back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run build.py
        run: python build.py

      - name: Commit and push if the page changed
        run: |
          git config user.name "AI Radar Bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "No changes — nothing to publish."
          else
            git commit -m "Auto-update headlines"
            git push
          fi
